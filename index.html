<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>匿名掲示板</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- 合言葉 -->
  <div id="login">

    <h2>合言葉</h2>

    <input id="password" placeholder="合言葉">

    <button id="login-button">
      入室
    </button>

  </div>

  <!-- 掲示板 -->
  <div id="board" style="display:none;">

    <h1>匿名掲示板</h1>

    <div id="thread-list"></div>

    <h2>スレッド作成</h2>

    <input id="title" placeholder="タイトル">

    <textarea id="content"
      placeholder="内容"></textarea>

    <button id="create-thread">
      投稿
    </button>

  </div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getDatabase,
      ref,
      push,
      onChildAdded
    }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // Firebase設定
    const firebaseConfig = {

      apiKey:
        "AIzaSyCQBiaZGtV97pfrpNMZcnmvs0IYoiE_ucQ",

      authDomain:
        "school-board-d7ca6.firebaseapp.com",

      databaseURL:
        "https://school-board-d7ca6-default-rtdb.asia-southeast1.firebasedatabase.app",

      projectId:
        "school-board-d7ca6",

      storageBucket:
        "school-board-d7ca6.firebasestorage.app",

      messagingSenderId:
        "29561028034",

      appId:
        "1:29561028034:web:d382d43c9dc7af3d352a5b"

    };

    // Firebase開始
    const app = initializeApp(firebaseConfig);

    const db = getDatabase(app);

    // スレ保存場所
    const threadRef = ref(db, "threads");

    // HTML取得
    const button =
      document.getElementById("create-thread");

    const threadList =
      document.getElementById("thread-list");

    // 固定ID生成
    function createId() {

      let savedId =
        localStorage.getItem("userId");

      // 保存済みならそのまま使う
      if(savedId) {

        return savedId;

      }

      // 新規生成
      const newId =
        "名無し" +
        Math.random()
          .toString(36)
          .substring(2, 6)
          .toUpperCase();

      // 保存
      localStorage.setItem(
        "userId",
        newId
      );

      return newId;

    }

    // 合言葉
    const loginButton =
      document.getElementById("login-button");

    loginButton.onclick = () => {

      const password =
        document.getElementById("password").value;

      if (password === "abc123") {

        document.getElementById("login")
          .style.display = "none";

        document.getElementById("board")
          .style.display = "block";

      } else {

        alert("合言葉が違います");

      }

    };

    // 【連投防止】直前のスレッド内容を記録する変数
    let lastThreadContent = "";

    // 投稿
    button.onclick = () => {

      const title =
        document.getElementById("title").value;

      const content =
        document.getElementById("content").value;

      const userId = createId();

      // 空っぽの投稿を制限
      if (!title.trim() || !content.trim()) {
        alert("タイトルと内容を入力してください");
        return;
      }

      // 連投防止：同じ内容を続けて投稿しようとしたらブロック
      if (content === lastThreadContent) {
        alert("同じ内容は連続で投稿できません！");
        return;
      }

      // Firebase保存
      push(threadRef, {

        id: userId,

        title: title,

        content: content

      });

      // 今回の投稿内容を記録
      lastThreadContent = content;

      // 連投防止：3秒間ボタンを押せなくするタイマー
      button.disabled = true;
      button.innerText = "残り3秒...";
      
      let sec = 3;
      const timer = setInterval(() => {
        sec--;
        if (sec > 0) {
          button.innerText = `残り${sec}秒...`;
        } else {
          clearInterval(timer);
          button.disabled = false;
          button.innerText = "投稿";
        }
      }, 1000);

      // 入力欄をクリア
      document.getElementById("title").value = "";
      document.getElementById("content").value = "";

    };

    // リアルタイム表示
    onChildAdded(threadRef, (data) => {

      const thread = data.val();

      const threadKey = data.key;

      const div =
        document.createElement("div");

      div.className = "thread";

      div.innerHTML = `
        <h3>${thread.title}</h3>

        <small>${thread.id}</small>

        <p>${thread.content}</p>

        <div class="comments"></div>

        <input class="comment-input"
          placeholder="コメント">

        <button class="comment-button">
          返信
        </button>
      `;

      // コメント保存場所
      const commentRef =
        ref(db, "comments/" + threadKey);

      // HTML取得
      const commentButton =
        div.querySelector(".comment-button");

      const commentInput =
        div.querySelector(".comment-input");

      const commentsDiv =
        div.querySelector(".comments");

      // 【連投防止】直前の返信コメントを記録する変数
      let lastCommentText = "";

      // コメント投稿
      commentButton.onclick = () => {

        const comment =
          commentInput.value;

        const userId = createId();

        // 空っぽのコメントを制限
        if (!comment.trim()) {
          alert("コメントを入力してください");
          return;
        }

        // 連投防止：同じコメントを続けて送信しようとしたらブロック
        if (comment === lastCommentText) {
          alert("同じコメントは連続で送信できません！");
          return;
        }

        push(commentRef, {

          id: userId,

          text: comment

        });

        // 今回のコメント内容を記録
        lastCommentText = comment;

        // 連投防止：3秒間返信ボタンを押せなくする
        commentButton.disabled = true;
        commentButton.innerText = "3秒待ってね";

        setTimeout(() => {
          commentButton.disabled = false;
          commentButton.innerText = "返信";
        }, 3000);

        // 入力欄をクリア
        commentInput.value = "";

      };

      // コメント表示
      onChildAdded(commentRef, (commentData) => {

        const comment =
          commentData.val();

        const p =
          document.createElement("p");

        p.innerHTML =
          "<b>" +
          comment.id +
          "</b>: " +
          comment.text;

        commentsDiv.appendChild(p);

      });

      threadList.appendChild(div);

    });

  </script>

</body>

</html>
