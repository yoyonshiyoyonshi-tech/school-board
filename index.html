<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>匿名掲示板</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- 合言葉 -->
  <div id="login">

    <h2>合言葉</h2>

    <input id="password" placeholder="合言葉">

    <button id="login-button">
      入室
    </button>

  </div>

  <!-- 掲示板 -->
  <div id="board" style="display:none;">

    <h1>匿名掲示板</h1>

    <!-- カテゴリ切り替えボタン -->
    <div id="category-tabs" style="margin-bottom: 20px;">
      <button class="tab-button" id="tab-all">すべて</button>
      <button class="tab-button" id="tab-class">クラス</button>
      <button class="tab-button" id="tab-club">部活</button>
      <button class="tab-button" id="tab-study">勉強</button>
    </div>

    <div id="thread-list"></div>

    <h2>スレッド作成</h2>

    <input id="title" placeholder="タイトル">

    <!-- スレッド作成時のカテゴリ選択 -->
    <div style="margin: 10px 0;">
      <label for="category-select">カテゴリ：</label>
      <select id="category-select">
        <option value="クラス">クラス</option>
        <option value="部活">部活</option>
        <option value="勉強">勉強</option>
      </select>
    </div>

    <textarea id="content"
      placeholder="内容"></textarea>

    <button id="create-thread">
      投稿
    </button>

  </div>

  <!-- 【修正】一番最初の確実な読み込み方式（type="module"）に戻しました -->
  <script type="module">

    import { initializeApp }
      from "https://gstatic.com";

    import {
      getDatabase,
      ref,
      push,
      onChildAdded
    }
      from "https://gstatic.com";

    // Firebase設定
    const firebaseConfig = {

      apiKey:
        "AIzaSyCQBiaZGtV97pfrpNMZcnmvs0IYoiE_ucQ",

      authDomain:
        "://firebaseapp.com",

      databaseURL:
        "https://firebasedatabase.app",

      projectId:
        "school-board-d7ca6",

      storageBucket:
        "school-board-d7ca6.firebasestorage.app",

      messagingSenderId:
        "29561028034",

      appId:
        "1:29561028034:web:d382d43c9dc7af3d352a5b"

    };

    // Firebase開始
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // スレ保存場所
    const threadRef = ref(db, "threads");

    // HTML取得
    const button =
      document.getElementById("create-thread");

    const threadList =
      document.getElementById("thread-list");

    // 固定ID生成
    function createId() {

      let savedId =
        localStorage.getItem("userId");

      if(savedId) {

        return savedId;

      }

      const newId =
        "名無し" +
        Math.random()
          .toString(36)
          .substring(2, 6)
          .toUpperCase();

      localStorage.setItem(
        "userId",
        newId
      );

      return newId;

    }

    // 合言葉
    const loginButton =
      document.getElementById("login-button");

    loginButton.onclick = () => {

      const password =
        document.getElementById("password").value;

      if (password === "abc123") {

        document.getElementById("login")
          .style.display = "none";

        document.getElementById("board")
          .style.display = "block";

      } else {

        alert("合言葉が違います");

      }

    };

    // 【連投防止】直前のスレッド内容を記録する変数
    let lastThreadContent = "";

    // 投稿
    button.onclick = () => {

      const title =
        document.getElementById("title").value;

      const content =
        document.getElementById("content").value;

      const category = 
        document.getElementById("category-select").value;

      const userId = createId();

      if (!title.trim() || !content.trim()) {
        alert("タイトルと内容を入力してください");
        return;
      }

      if (content === lastThreadContent) {
        alert("同じ内容は連続で投稿できません！");
        return;
      }

      // Firebase保存
      push(threadRef, {

        id: userId,

        title: title,

        content: content,

        category: category

      });

      lastThreadContent = content;

      button.disabled = true;
      button.innerText = "残り3秒...";
      
      let sec = 3;
      const timer = setInterval(() => {
        sec--;
        if (sec > 0) {
          button.innerText = `残り${sec}秒...`;
        } else {
          clearInterval(timer);
          button.disabled = false;
          button.innerText = "投稿";
        }
      }, 1000);

      document.getElementById("title").value = "";
      document.getElementById("content").value = "";

    };

    // リアルタイム表示
    onChildAdded(threadRef, (data) => {

      const thread = data.val();

      const threadKey = data.key;

      const div =
        document.createElement("div");

      div.className = "thread";
      
      div.setAttribute("data-category", thread.category || "クラス");

      div.innerHTML = `
        <h3>[${thread.category || "クラス"}] ${thread.title}</h3>

        <small>${thread.id}</small>

        <p>${thread.content}</p>

        <div class="comments"></div>

        <input class="comment-input"
          placeholder="コメント">

        <button class="comment-button">
          返信
        </button>
      `;

      // コメント保存場所
      const commentRef = ref(db, "comments/" + threadKey);

      const commentButton =
        div.querySelector(".comment-button");

      const commentInput =
        div.querySelector(".comment-input");

      const commentsDiv =
        div.querySelector(".comments");

      let lastCommentText = "";

      // コメント投稿
      commentButton.onclick = () => {

        const comment =
          commentInput.value;

        const userId = createId();

        if (!comment.trim()) {
          alert("コメントを入力してください");
          return;
        }

        if (comment === lastCommentText) {
          alert("同じコメントは連続で送信できません！");
          return;
        }

        push(commentRef, {

          id: userId,

          text: comment

        });

        lastCommentText = comment;

        commentButton.disabled = true;
        commentButton.innerText = "3秒待ってね";

        setTimeout(() => {
          commentButton.disabled = false;
          commentButton.innerText = "返信";
        }, 3000);

        commentInput.value = "";

      };

      // コメント表示
      onChildAdded(commentRef, (commentData) => {

        const comment =
          commentData.val();

        const p =
          document.createElement("p");

        p.innerHTML =
          "<b>" +
          comment.id +
          "</b>: " +
          comment.text;

        commentsDiv.appendChild(p);

      });

      threadList.appendChild(div);

    });

    // 【追加】type="module" の中でもボタンが正常に動くように修正しました
    function filterCategory(category) {
      const threads = document.getElementsByClassName("thread");
      
      for (let i = 0; i < threads.length; i++) {
        const threadCategory = threads[i].getAttribute("data-category");
        
        if (category === "all" || threadCategory === category) {
          threads[i].style.display = "block";
        } else {
          threads[i].style.display = "none";
        }
      }
    }

    // ボタンをクリックした時の動きをここで完全に紐付けました
    document.getElementById("tab-all").onclick = () => filterCategory("all");
    document.getElementById("tab-class").onclick = () => filterCategory("クラス");
    document.getElementById("tab-club").onclick = () => filterCategory("部活");
    document.getElementById("tab-study").onclick = () => filterCategory("勉強");

  </script>

</body>

</html>
